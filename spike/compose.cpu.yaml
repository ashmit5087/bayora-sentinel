# CPU fallback for the spike (use if the GPU container will not start).
#   docker compose -f compose.cpu.yaml up -d
name: sentinel-spike-cpu

services:
  model:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - "-m"
      - "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${CTX:-8192}"
      - "--parallel"
      - "2"
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8080:8080"
